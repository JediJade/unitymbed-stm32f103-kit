# STM32 over ST-Link, DAP-direct flavor (no HLA — works with the UnityMbed
# OpenOCD bundle regardless of legacy script dirs on the search path).
# `unitymbed init` rewrites the flash driver line for the detected family.
source [find interface/stlink.cfg]
transport select swd
adapter speed 950

swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
chip.cpu configure -work-area-phys 0x20000000 -work-area-size 0x1000 -work-area-backup 0

flash bank chip.flash stm32f1x 0x08000000 0 0 0 chip.cpu
reset_config none
cortex_m reset_config sysresetreq
